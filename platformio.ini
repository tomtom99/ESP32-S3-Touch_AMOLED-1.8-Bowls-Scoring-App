; PlatformIO project configuration for the Crown Green Bowls Scoring App.
; Target hardware: Waveshare ESP32-S3-Touch-AMOLED-1.8
; https://www.waveshare.com/wiki/ESP32-S3-Touch-AMOLED-1.8

[env:waveshare-esp32s3-amoled]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_port = COM11
monitor_port = COM11

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc

lib_deps =
    lvgl/lvgl@8.3.11
    moononournation/GFX Library for Arduino@1.4.9
    bblanchon/ArduinoJson@7.0.4
    lewisxhe/XPowersLib@0.2.6

; Native (host machine) environment used to run the framework-independent
; game logic unit tests in test/test_bowls_game without needing any
; ESP32-specific hardware or libraries.
[env:native]
platform = native
build_flags =
    -std=c++17
    -Isrc
